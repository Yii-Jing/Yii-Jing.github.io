<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting - Yi Jing</title>
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <script>window.location.replace({{ page.redirect_to | relative_url | jsonify }} + window.location.search + window.location.hash);</script>
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
  </head>
  <body><a href="{{ page.redirect_to | relative_url }}">{% if page.lang == 'zh' %}继续阅读{% else %}Continue reading{% endif %}</a></body>
</html>
